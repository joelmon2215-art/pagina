<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Cuenta | Portal Estudiantil</title>
    <link rel="stylesheet" href="styles/registro.css">
</head>
<body>

    <div class="login-box">
        <h2>Registro de Usuario</h2>
        
        <form id="registroForm">
            <input type="text" id="regNombre" placeholder="Nombre" required>
            <input type="text" id="regApellido" placeholder="Apellido" required>
            
            <input type="text" id="regCuil" placeholder="CUIL (Sin guiones)" required>
            <input type="email" id="regEmail" placeholder="Correo Electrónico" required>

            <label for="regRol">¿Quién eres?</label>
            <select id="regRol" required>
                <option value="" disabled selected>Selecciona tu rol</option>
                <option value="alumno">Alumno</option>
                <option value="docente">Docente</option>
                <option value="egresado">Egresado</option>
                <option value="tutor">Padre/Tutor</option>
            </select>

            <input type="password" id="regPass" placeholder="Contraseña" required>
            <input type="password" id="regPassConfirm" placeholder="Confirmar Contraseña" required>
            
            <button type="submit" style="background-color: #27ae60;">Registrarse</button>
            
            <p id="errorMatch"></p>
        </form>

        <div class="registro-link">
            <p>¿Ya tienes cuenta? <a href="login.html">Inicia sesión aquí</a></p>
        </div>
    </div>

    <script src="scripts/registro.js"></script>
</body>
</html>
