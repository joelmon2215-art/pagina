<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Estudiantil | Inicio de Sesión</title>
    <link rel="stylesheet" href="styles/login.css">
</head>
<body>

    <div class="login-box">
        <div class="back-home">
         <a href="index.html">← Volver al sitio principal</a>
        </div>

        <h2>Portal Estudiantil</h2>

        <p id="mensajeError"></p>

        <form id="loginForm">
            <div class="input-group">
                <label for="cuil">CUIL</label>
                <input type="text" id="cuil" placeholder="Ingresa tu CUIL" required>
            </div>

            <div class="input-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="Correo institucional" required>
            </div>

            <div class="input-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" placeholder="********" required>
            </div>

            <button type="submit">Ingresar</button>
        </form>

    </div>

    <script src="scripts/login.js"></script>
</body>
</html>
